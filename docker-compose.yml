services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ar
      POSTGRES_PASSWORD: ar
      POSTGRES_DB: authorization_registry
    ports:
      - "5432:5432"
    volumes:
      - ar-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ar -d authorization_registry"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["npm", "run", "start:migrate"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ar:ar@postgres:5432/authorization_registry?schema=public
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  ar-pg-data:
