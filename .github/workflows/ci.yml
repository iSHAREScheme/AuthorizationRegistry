name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - modernize/typescript

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ar
          POSTGRES_PASSWORD: ar
          POSTGRES_DB: authorization_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ar -d authorization_registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ar:ar@localhost:5432/authorization_registry?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
